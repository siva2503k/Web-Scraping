services:
  - type: web
    name: product-sentiment-analyzer-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -c "import nltk; nltk.download('vader_lexicon')"
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: MONGO_URI
        sync: false
      - key: DB_NAME
        value: product_sentiment_db
      - key: FRONTEND_URL
        value: "*"
